name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: validate
    if: >-
      github.repository == 'benknab/btcpp-2026-berlin-payments-hackathon' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: bark-payments-production
      cancel-in-progress: false
    steps:
      - name: Deploy the validated commit on the server
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_SSH_USER || 'bark-deploy' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_USE_CLOUDFLARE: ${{ vars.DEPLOY_USE_CLOUDFLARE }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_SSH_HOST.}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY.}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?Set DEPLOY_SSH_KNOWN_HOSTS.}"
          umask 077
          directory=$(mktemp -d "$RUNNER_TEMP/deploy.XXXXXX")
          trap 'rm -f "$directory/key" "$directory/known_hosts" "$directory/cloudflared"; rmdir "$directory"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$directory/key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$directory/known_hosts"
          options=(
            -F /dev/null
            -i "$directory/key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$directory/known_hosts"
            -o ConnectTimeout=30
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )
          if [[ "$DEPLOY_USE_CLOUDFLARE" == "true" ]]; then
            curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
              https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64 \
              --output "$directory/cloudflared"
            printf '%s  %s\n' \
              77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2 \
              "$directory/cloudflared" | sha256sum --check
            chmod 700 "$directory/cloudflared"
            options+=(-o "ProxyCommand=$directory/cloudflared access ssh --hostname %h")
          fi
          ssh "${options[@]}" -p "$DEPLOY_PORT" -l "$DEPLOY_USER" "$DEPLOY_HOST" "deploy $DEPLOY_COMMIT"
